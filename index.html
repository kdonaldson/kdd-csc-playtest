<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chocolate Sea Salt Caramels — Playtest</title>
<meta name="description" content="Playtest build of Chocolate Sea Salt Caramels, a push-your-luck tile game set on the shores of Sweetport." />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --sand: #F5EFDD;
    --card: #FFFBF0;
    --ink: #2A1E14;
    --ink-soft: #5B4A38;
    --caramel: #C97A3D;
    --tide: #3C7A8C;
    --border: #D8C7A0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
  }

  main {
    width: 100%;
    max-width: 760px;
  }

  .title-image {
    display: block;
    width: 100%;
    max-width: 760px;
    margin: 0 auto 36px;
    border-radius: 14px;
    box-shadow: 0 18px 40px -20px rgba(60, 42, 20, 0.35);
  }

  .frame-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 18px 40px -20px rgba(60, 42, 20, 0.35);
  }

  .frame-inner {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  iframe {
    display: block;
    width: 100%;
    height: 600px;
    border: 0;
  }

  footer {
    margin-top: 32px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
  }

  footer a {
    color: var(--caramel);
    text-decoration: none;
    border-bottom: 1px solid rgba(201, 122, 61, 0.4);
  }

  footer a:hover {
    border-bottom-color: var(--caramel);
  }

  @media (max-width: 480px) {
    iframe { height: 520px; }
    .frame-wrap { padding: 6px; border-radius: 14px; }
  }
</style>
</head>
<body>
<main>
  <img class="title-image" src="assets/title.jpg" alt="Chocolate Sea Salt Caramels" />

  <div class="frame-wrap">
    <div class="frame-inner">
      <iframe
        src="https://claude.site/public/artifacts/2799b37d-0450-4f28-8c90-d25d5b195dd3/embed"
        title="Chocolate Sea Salt Caramels Playtest App"
        allow="clipboard-write"
        allowfullscreen
        loading="lazy"
      ></iframe>
    </div>
  </div>

  <footer>
    Designed by Keith Donaldson · playtest build hosted on GitHub Pages
  </footer>
</main>
</body>
</html>
